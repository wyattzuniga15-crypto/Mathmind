name: Build Fabric mod

# Builds minecraft/fabric-mod into a downloadable jar.
#
# This exists because the machine the mod was written on cannot reach Mojang's
# or Fabric's maven repositories — they are blocked by egress policy — so it
# could never produce a jar itself. GitHub's runners can, which turns "install
# a JDK and run Gradle yourself" into "download the jar from the Actions tab".

on:
  push:
    branches: ["**"]
    paths:
      - "minecraft/fabric-mod/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch itself rather than a detached commit, so the built
      # jar can be committed back at the end.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # Two JDKs, and the order matters. Recent Loom releases refuse to run on
      # anything below 25, while Minecraft 1.21 is compiled against 21 — so
      # Gradle runs on the last one listed (25) and the toolchain compiles
      # with 21.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Resolve Fabric versions
        working-directory: minecraft/fabric-mod
        run: |
          set -euo pipefail

          # Every Fabric version number is tied to a Minecraft release and moves
          # with it, so rather than commit a guess that rots, ask the maven
          # repository what actually exists for the version being targeted.
          versions() {
            curl -sSL "$1" \
              | grep -o '<version>[^<]*</version>' \
              | sed 's/<[^>]*>//g'
          }

          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "Targeting Minecraft $MC"

          BASE=https://maven.fabricmc.net
          LOOM=$(versions "$BASE/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml" \
                 | grep -v SNAPSHOT | tail -1)
          API=$(versions "$BASE/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" \
                 | grep -- "+${MC}\$" | tail -1)
          YARN=$(versions "$BASE/net/fabricmc/yarn/maven-metadata.xml" \
                 | grep "^${MC}+" | tail -1)
          LOADER=$(versions "$BASE/net/fabricmc/fabric-loader/maven-metadata.xml" \
                 | grep -E '^[0-9.]+$' | tail -1)

          echo "loom=$LOOM  api=$API  yarn=$YARN  loader=$LOADER"

          # An empty result means nothing is published for this Minecraft
          # version yet. Fail loudly here rather than letting Gradle report it
          # as an unresolved dependency ten lines into a stack trace.
          for pair in "loom:$LOOM" "api:$API" "yarn:$YARN" "loader:$LOADER"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::no ${pair%%:*} version published for Minecraft $MC"
              exit 1
            fi
          done

          # The Anthropic SDK lives on Maven Central rather than Fabric's
          # repository, but the reasoning is the same: ask what is published
          # instead of committing a guess that goes stale.
          SDK=$(versions "https://repo1.maven.org/maven2/com/anthropic/anthropic-java/maven-metadata.xml" \
                | grep -E '^[0-9.]+$' | tail -1)
          echo "anthropic-java=$SDK"
          if [ -z "$SDK" ]; then
            echo "::error::could not resolve an anthropic-java version"
            exit 1
          fi
          sed -i "s|^anthropic_version=.*|anthropic_version=$SDK|" gradle.properties

          sed -i "s|^loom_version=.*|loom_version=$LOOM|" gradle.properties
          sed -i "s|^fabric_version=.*|fabric_version=$API|" gradle.properties
          sed -i "s|^yarn_mappings=.*|yarn_mappings=$YARN|" gradle.properties
          sed -i "s|^loader_version=.*|loader_version=$LOADER|" gradle.properties

          # Gradle won't find the runner's other JDKs on its own; setup-java
          # leaves each one in a JAVA_HOME_<version>_<arch> variable.
          if ! grep -q '^org.gradle.java.installations.fromEnv' gradle.properties; then
            echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> gradle.properties
          fi

          echo "--- gradle.properties ---"
          cat gradle.properties

      # The wrapper ships pinned to the Gradle available where this project was
      # written, which predates Java 25 and refuses to start on it ("unsupported
      # class file major version 69"). Since Loom now requires 25, Gradle has to
      # move too — so take whatever release is current rather than pinning a
      # number that will age into the same problem.
      - name: Use a Gradle that runs on this JDK
        working-directory: minecraft/fabric-mod
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json
          import urllib.request
          from pathlib import Path

          version = json.load(urllib.request.urlopen(
              "https://services.gradle.org/versions/current"))["version"]
          props = Path("gradle/wrapper/gradle-wrapper.properties")
          out = []
          for line in props.read_text().splitlines():
              if line.startswith("distributionUrl="):
                  line = ("distributionUrl=https\\://services.gradle.org"
                          f"/distributions/gradle-{version}-bin.zip")
              out.append(line)
          props.write_text("\n".join(out) + "\n")
          print("Gradle", version)
          EOF
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Check the project before building
        working-directory: minecraft/fabric-mod
        run: python3 verify.py

      - name: Build
        working-directory: minecraft/fabric-mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Show what was produced
        if: always()
        working-directory: minecraft/fabric-mod
        run: ls -la build/libs/ || echo "no jars produced"

      # A green build does not prove the SDK actually ships. Loom's include()
      # is non-transitive, so a missing dependency surfaces as a
      # NoClassDefFoundError at Minecraft launch — long after CI has gone green
      # and reported success. Check the jar really carries them.
      - name: Check the bundled SDK really shipped
        working-directory: minecraft/fabric-mod
        run: |
          set -euo pipefail
          jar=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "inspecting $jar"
          nested=$(unzip -l "$jar" | grep -oE 'META-INF/jars/[^ ]+\.jar' || true)
          if [ -z "$nested" ]; then
            echo "::error::no jar-in-jar entries — the SDK was not bundled"
            exit 1
          fi
          echo "$nested" | sed 's|^|  bundled: |'
          echo "$nested" | grep -q 'anthropic' \
            || { echo "::error::anthropic-java itself is missing from the bundle"; exit 1; }
          count=$(echo "$nested" | wc -l)
          echo "$count nested jars bundled"
          # The SDK alone means the transitive include did nothing, which is the
          # exact failure this step exists to catch.
          if [ "$count" -lt 2 ]; then
            echo "::error::only $count nested jar — transitive dependencies did not ship"
            exit 1
          fi

      # A run artifact is only downloadable by someone signed in to GitHub,
      # which is a poor last step for anyone who just wants the file. Commit it
      # into the repository as well, where it can be fetched and handed over
      # directly.
      - name: Commit the jar into the repository
        run: |
          set -euo pipefail
          mkdir -p minecraft/fabric-mod/dist
          rm -f minecraft/fabric-mod/dist/*.jar
          # Skip the sources jar; only the mod itself is any use in mods/.
          for jar in minecraft/fabric-mod/build/libs/*.jar; do
            case "$jar" in
              *sources*) continue ;;
              *) cp "$jar" minecraft/fabric-mod/dist/ ;;
            esac
          done
          ls -la minecraft/fabric-mod/dist/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f minecraft/fabric-mod/dist
          # [skip ci] or committing here would trigger this workflow again.
          git diff --cached --quiet || git commit -m "Publish built mod jar [skip ci]"
          git push

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: orbital-arsenal-mod
          path: minecraft/fabric-mod/build/libs/*.jar
          if-no-files-found: error
