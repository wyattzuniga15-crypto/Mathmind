name: Build Fabric mod

# Builds minecraft/fabric-mod into a downloadable jar.
#
# This exists because the machine the mod was written on cannot reach Mojang's
# or Fabric's maven repositories — they are blocked by egress policy — so it
# could never produce a jar itself. GitHub's runners can, which turns "install
# a JDK and run Gradle yourself" into "download the jar from the Actions tab".

on:
  push:
    branches: ["**"]
    paths:
      - "minecraft/fabric-mod/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch itself rather than a detached commit, so the built
      # jar can be committed back at the end.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # Two JDKs, and the order matters. Recent Loom releases refuse to run on
      # anything below 25, while Minecraft 1.21 is compiled against 21 — so
      # Gradle runs on the last one listed (25) and the toolchain compiles
      # with 21.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Resolve Fabric versions
        working-directory: minecraft/fabric-mod
        run: |
          set -euo pipefail

          # Every Fabric version number is tied to a Minecraft release and moves
          # with it, so rather than commit a guess that rots, ask the maven
          # repository what actually exists for the version being targeted.
          versions() {
            curl -sSL "$1" \
              | grep -o '<version>[^<]*</version>' \
              | sed 's/<[^>]*>//g'
          }

          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "Targeting Minecraft $MC"

          BASE=https://maven.fabricmc.net
          # `|| true` on each: without it, a lookup that matches nothing fails
          # the pipeline under pipefail and kills the step mid-assignment, with
          # no clue which of the four it was. The explicit check below names it.
          LOOM=$(versions "$BASE/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml" \
                 | grep -v SNAPSHOT | tail -1 || true)
          API=$(versions "$BASE/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" \
                 | grep -- "+${MC}\$" | tail -1 || true)
          YARN=$(versions "$BASE/net/fabricmc/yarn/maven-metadata.xml" \
                 | grep "^${MC}+" | tail -1 || true)
          LOADER=$(versions "$BASE/net/fabricmc/fabric-loader/maven-metadata.xml" \
                 | grep -E '^[0-9.]+$' | tail -1 || true)

          echo "loom=$LOOM  api=$API  yarn=$YARN  loader=$LOADER"

          # An empty result means nothing is published for this Minecraft
          # version yet. Fail loudly here rather than letting Gradle report it
          # as an unresolved dependency ten lines into a stack trace.
          for pair in "loom:$LOOM" "api:$API" "yarn:$YARN" "loader:$LOADER"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::no ${pair%%:*} version published for Minecraft $MC"
              exit 1
            fi
          done

          # The Anthropic SDK lives on Maven Central rather than Fabric's
          # repository, and unlike the four above it is not load-bearing for
          # the build: gradle.properties already pins a version known to
          # resolve. So this looks for something newer and keeps the pin if it
          # cannot find one, rather than failing.
          #
          # It used to fail, and did — Maven Central returned nothing once and
          # took the whole build with it, because under `set -o pipefail` a
          # grep that matches nothing fails the pipeline and errexit does the
          # rest. An optional dependency's version lookup should never be able
          # to stop a mod compiling.
          SDK=$(versions "https://repo1.maven.org/maven2/com/anthropic/anthropic-java/maven-metadata.xml" \
                | grep -E '^[0-9.]+$' | tail -1 || true)
          if [ -n "$SDK" ]; then
            echo "anthropic-java=$SDK (from maven)"
            sed -i "s|^anthropic_version=.*|anthropic_version=$SDK|" gradle.properties
          else
            echo "::warning::could not reach Maven Central for anthropic-java;" \
                 "keeping the pinned $(grep '^anthropic_version=' gradle.properties)"
          fi

          sed -i "s|^loom_version=.*|loom_version=$LOOM|" gradle.properties
          sed -i "s|^fabric_version=.*|fabric_version=$API|" gradle.properties
          sed -i "s|^yarn_mappings=.*|yarn_mappings=$YARN|" gradle.properties
          sed -i "s|^loader_version=.*|loader_version=$LOADER|" gradle.properties

          # Gradle won't find the runner's other JDKs on its own; setup-java
          # leaves each one in a JAVA_HOME_<version>_<arch> variable.
          if ! grep -q '^org.gradle.java.installations.fromEnv' gradle.properties; then
            echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> gradle.properties
          fi

          echo "--- gradle.properties ---"
          cat gradle.properties

      # The wrapper ships pinned to the Gradle available where this project was
      # written, which predates Java 25 and refuses to start on it ("unsupported
      # class file major version 69"). Since Loom now requires 25, Gradle has to
      # move too — so take whatever release is current rather than pinning a
      # number that will age into the same problem.
      - name: Use a Gradle that runs on this JDK
        working-directory: minecraft/fabric-mod
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json
          import urllib.request
          from pathlib import Path

          version = json.load(urllib.request.urlopen(
              "https://services.gradle.org/versions/current"))["version"]
          props = Path("gradle/wrapper/gradle-wrapper.properties")
          out = []
          for line in props.read_text().splitlines():
              if line.startswith("distributionUrl="):
                  line = ("distributionUrl=https\\://services.gradle.org"
                          f"/distributions/gradle-{version}-bin.zip")
              out.append(line)
          props.write_text("\n".join(out) + "\n")
          print("Gradle", version)
          EOF
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Check the project before building
        working-directory: minecraft/fabric-mod
        run: python3 verify.py

      - name: Build
        working-directory: minecraft/fabric-mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      # Entity rendering was rebuilt around render states in 1.21.2, and the
      # exact shapes are not something I can check from where this mod is
      # written. Loom has just produced a remapped Minecraft jar with real
      # signatures in it, so ask that rather than guess and burn build after
      # build on it. Prints only; never fails the build.
      - name: Dump the entity and rendering API
        if: always()
        working-directory: minecraft/fabric-mod
        run: |
          set +e
          jar=$(find ~/.gradle/caches/fabric-loom .gradle -name '*.jar' 2>/dev/null \
                | grep -iE 'minecraft.*(named|mapped)' | head -1)
          if [ -z "$jar" ]; then
            echo "could not find a remapped Minecraft jar; searching wider"
            jar=$(find ~/.gradle/caches -name '*.jar' 2>/dev/null | while read -r f; do
                    if unzip -l "$f" 2>/dev/null | grep -q 'net/minecraft/client/render/entity/EntityRenderer.class'; then
                      echo "$f"; break
                    fi
                  done | head -1)
          fi
          echo "using: $jar"
          # Publish it: the checks below were re-deriving this with only the
          # first, narrower glob, which found nothing — so they exited early
          # and reported success without ever looking at anything.
          [ -n "$jar" ] && echo "MC_JAR=$jar" >> "$GITHUB_ENV"
          [ -z "$jar" ] && exit 0

          for cls in \
            net.minecraft.client.render.entity.EntityRenderer \
            net.minecraft.client.render.entity.MobEntityRenderer \
            net.minecraft.client.render.entity.LivingEntityRenderer \
            net.minecraft.client.render.entity.EntityRendererFactory \
            net.minecraft.client.render.entity.model.EntityModel \
            net.minecraft.client.render.entity.state.LivingEntityRenderState \
            net.minecraft.client.render.entity.state.EntityRenderState \
            net.minecraft.client.model.ModelPart \
            net.minecraft.client.model.ModelData \
            net.minecraft.client.model.ModelPartBuilder \
            net.minecraft.client.model.ModelTransform \
            net.minecraft.client.model.TexturedModelData \
            net.minecraft.client.render.entity.model.EntityModelLayer \
            net.minecraft.client.model.Model \
            net.minecraft.client.model.ModelPartData \
            net.minecraft.entity.EntityType$Builder \
            net.minecraft.entity.attribute.EntityAttributes \
            net.minecraft.entity.attribute.DefaultAttributeContainer$Builder \
            net.minecraft.entity.mob.HostileEntity \
            net.minecraft.entity.attribute.DefaultAttributeContainer \
            net.minecraft.entity.EntityDimensions ; do
            echo "=============================================================="
            echo "### $cls"
            javap -cp "$jar" "$cls" 2>&1 | head -45
          done
          exit 0

      # Whether a SoundEvents constant is a bare SoundEvent or a
      # RegistryEntry.Reference is not guessable and not consistent:
      # ENTITY_GENERIC_EXPLODE is a Reference, ENTITY_CAT_HISS is bare. Getting
      # it wrong costs a whole build, and getting it wrong in the other
      # direction costs another. So ask the jar: pull every SoundEvents
      # constant the mod actually names out of the sources and print its real
      # declared type. Runs on failure too, which is exactly when it is needed.
      # Same trick as the sounds below, for the same reason. EntityAttributes
      # lost its GENERIC_ prefix at 1.21.2, and SCALE only exists at all from
      # 1.20.5 — so a name that is right on one version is a failed build on
      # another. Ask the jar which ones are real, and on a miss print every
      # name it does have, so one round trip carries the answer instead of
      # just the complaint.
      - name: Check every entity attribute the mod names
        if: always()
        working-directory: minecraft/fabric-mod
        run: |
          set +e
          jar="${MC_JAR:-}"
          # A check that cannot run must not look like a check that passed.
          # This one silently reported success for a whole release because it
          # could not find the jar and said so in a line nobody reads.
          if [ -z "$jar" ] || [ ! -f "$jar" ]; then
            echo "::warning::could not find the Minecraft jar — this check did NOT run"
            exit 0
          fi
          used=$(grep -rhoE 'EntityAttributes\.[A-Z_0-9]+' src/main/java | sort -u | cut -d. -f2)
          [ -z "$used" ] && echo "the mod names no attributes" && exit 0
          javap -cp "$jar" net.minecraft.entity.attribute.EntityAttributes > /tmp/attrs.txt 2>&1
          missed=0
          for name in $used; do
            if grep -qE "[ .]$name;" /tmp/attrs.txt; then
              printf '%-28s ok\n' "$name"
            else
              echo "::error::EntityAttributes.$name does not exist in this Minecraft"
              printf '%-28s MISSING\n' "$name"
              missed=1
            fi
          done
          if [ "$missed" = 1 ]; then
            echo "--- attributes this version actually has ---"
            grep -oE '[A-Z][A-Z_0-9]+;' /tmp/attrs.txt | tr -d ';' | sort
          fi
          exit 0

      - name: Dump the true type of every sound the mod uses
        if: always()
        working-directory: minecraft/fabric-mod
        run: |
          set +e
          jar="${MC_JAR:-}"
          # A check that cannot run must not look like a check that passed.
          # This one silently reported success for a whole release because it
          # could not find the jar and said so in a line nobody reads.
          if [ -z "$jar" ] || [ ! -f "$jar" ]; then
            echo "::warning::could not find the Minecraft jar — this check did NOT run"
            exit 0
          fi
          used=$(grep -rhoE 'SoundEvents\.[A-Z_0-9]+' src/main/java | sort -u | cut -d. -f2)
          [ -z "$used" ] && echo "the mod names no sounds" && exit 0
          javap -cp "$jar" net.minecraft.sound.SoundEvents > /tmp/sounds.txt 2>&1
          echo "sound                             declared type"
          echo "--------------------------------------------------------------"
          for name in $used; do
            line=$(grep -E "[ .]$name;" /tmp/sounds.txt | head -1)
            if [ -z "$line" ]; then
              echo "::error::SoundEvents.$name does not exist in this Minecraft"
              printf '%-32s MISSING\n' "$name"
              continue
            fi
            type=$(echo "$line" | sed -E 's/^ *public static final //; s/ .*//')
            printf '%-32s %s\n' "$name" "$type"
            case "$type" in
              *RegistryEntry*) grep -q "SoundEvents\.$name\.value()" -r src/main/java \
                  || echo "::error::SoundEvents.$name is a registry entry — it needs .value()" ;;
              *) grep -q "SoundEvents\.$name\.value()" -r src/main/java \
                  && echo "::error::SoundEvents.$name is a bare SoundEvent — drop the .value()" ;;
            esac
          done
          exit 0

      # An ingredient id that does not exist makes the whole recipe fail to
      # load. Minecraft logs one line about it at startup and carries on, so
      # the only symptom a player sees is an item that cannot be crafted in
      # survival, with nothing on screen to say why.
      #
      # Read the registry, not the Java class. The first two versions of this
      # check compared ingredient ids against field names in net.minecraft.item
      # .Items, and failed the build for a whole morning over minecraft:chain —
      # which is a perfectly real item that simply has no constant named CHAIN.
      # A field name is not a registry id. The vanilla language file, which
      # ships inside the jar, has a key for every item and every block by id,
      # and that is what a recipe actually names.
      - name: Check every recipe ingredient is a real item
        if: always()
        working-directory: minecraft/fabric-mod
        run: |
          set +e
          jar="${MC_JAR:-}"
          if [ -z "$jar" ] || [ ! -f "$jar" ]; then
            echo "::warning::could not find the Minecraft jar — this check did NOT run"
            exit 0
          fi
          unzip -p "$jar" assets/minecraft/lang/en_us.json > /tmp/vanilla-lang.json 2>/dev/null
          if [ ! -s /tmp/vanilla-lang.json ]; then
            echo "::warning::no vanilla language file in the jar — this check did NOT run"
            exit 0
          fi
          python3 - <<'PY'
          import glob, json, sys
          lang = json.load(open("/tmp/vanilla-lang.json"))
          real = {k.split(".", 2)[2] for k in lang
                  if k.startswith(("item.minecraft.", "block.minecraft."))}
          print(f"{len(real)} item and block ids in this Minecraft")
          bad = []
          for path in sorted(glob.glob("src/main/resources/data/orbital/recipe/*.json")):
              for value in json.load(open(path))["key"].values():
                  name = (value["item"] if isinstance(value, dict) else value).split(":")[-1]
                  if name not in real:
                      bad.append((name, path))
          for name, path in bad:
              print(f"::error::recipe ingredient minecraft:{name} is not a real id "
                    f"— used by {path}")
          print(f"{len(bad)} unknown ingredients")
          sys.exit(1 if bad else 0)
          PY

      # One question, asked directly. Item.appendTooltip is how a description
      # reaches the player in game, and its signature has changed in almost
      # every recent version — the context type, the display component and the
      # tooltip type have each been added, moved or renamed. Dumping the whole
      # class to find it buried twenty classes of output in the log; this
      # prints the line and nothing else.
      - name: The exact shape of the tooltip API
        if: always()
        working-directory: minecraft/fabric-mod
        run: |
          set +e
          jar="${MC_JAR:-}"
          if [ -z "$jar" ] || [ ! -f "$jar" ]; then
            echo "::warning::could not find the Minecraft jar — this check did NOT run"
            exit 0
          fi
          # Written to a file and committed, not just printed. The same reason
          # known_sound_types.json exists: what the build reports about the
          # real API is worth keeping, and digging it back out of a log tail
          # costs a round trip every time it is needed.
          # Bare name, not a repo-relative path: this step already runs with
          # working-directory: minecraft/fabric-mod, so the first version put
          # the file two directories deep and the commit step never saw it.
          out=known_tooltip_api.txt
          {
            echo "# What this Minecraft really declares around item tooltips."
            echo "# Written by the workflow from javap against the remapped jar."
            echo "# Do not edit by hand — rerun the build."
            echo
            echo "--- net.minecraft.item.Item, anything mentioning tooltip ---"
            javap -cp "$jar" net.minecraft.item.Item | grep -i tooltip \
              || echo "Item declares no tooltip method at all"
            echo
            echo "--- net.minecraft.item.Item.TooltipContext ---"
            javap -cp "$jar" 'net.minecraft.item.Item$TooltipContext' | head -12
            echo
            echo "--- net.minecraft.item.tooltip.TooltipAppender ---"
            javap -cp "$jar" net.minecraft.item.tooltip.TooltipAppender 2>/dev/null | head -10 \
              || echo "this version has no TooltipAppender"
            echo
            echo "--- net.minecraft.component.type.TooltipDisplayComponent ---"
            javap -cp "$jar" net.minecraft.component.type.TooltipDisplayComponent 2>/dev/null \
              | head -10 || echo "this version has no TooltipDisplayComponent"
          } > "$out" 2>&1
          cat "$out"
          exit 0

      - name: Show what was produced
        if: always()
        working-directory: minecraft/fabric-mod
        run: ls -la build/libs/ || echo "no jars produced"

      # A green build does not prove the SDK actually ships. Loom's include()
      # is non-transitive, so a missing dependency surfaces as a
      # NoClassDefFoundError at Minecraft launch — long after CI has gone green
      # and reported success. Check the jar really carries them.
      - name: Check the bundled SDK really shipped
        working-directory: minecraft/fabric-mod
        run: |
          set -euo pipefail
          jar=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "inspecting $jar"
          nested=$(unzip -l "$jar" | grep -oE 'META-INF/jars/[^ ]+\.jar' || true)
          if [ -z "$nested" ]; then
            echo "::error::no jar-in-jar entries — the SDK was not bundled"
            exit 1
          fi
          echo "$nested" | sed 's|^|  bundled: |'
          echo "$nested" | grep -q 'anthropic' \
            || { echo "::error::anthropic-java itself is missing from the bundle"; exit 1; }
          count=$(echo "$nested" | wc -l)
          echo "$count nested jars bundled"
          # The SDK alone means the transitive include did nothing, which is the
          # exact failure this step exists to catch.
          if [ "$count" -lt 2 ]; then
            echo "::error::only $count nested jar — transitive dependencies did not ship"
            exit 1
          fi

      # A run artifact is only downloadable by someone signed in to GitHub,
      # which is a poor last step for anyone who just wants the file. Commit it
      # into the repository as well, where it can be fetched and handed over
      # directly.
      - name: Commit the jar into the repository
        run: |
          set -euo pipefail
          mkdir -p minecraft/fabric-mod/dist
          rm -f minecraft/fabric-mod/dist/*.jar
          # Skip the sources jar; only the mod itself is any use in mods/.
          for jar in minecraft/fabric-mod/build/libs/*.jar; do
            case "$jar" in
              *sources*) continue ;;
              *) cp "$jar" minecraft/fabric-mod/dist/ ;;
            esac
          done
          ls -la minecraft/fabric-mod/dist/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f minecraft/fabric-mod/dist
          # And whatever the probes learned about the real API, so it does not
          # have to be dug back out of a log every time it is wanted. Says so
          # when it is missing rather than swallowing the error — the first
          # version wrote the file to the wrong path and this line hid it.
          if [ -f minecraft/fabric-mod/known_tooltip_api.txt ]; then
            git add -f minecraft/fabric-mod/known_tooltip_api.txt
          else
            echo "::warning::the API probe wrote no known_tooltip_api.txt"
          fi
          # [skip ci] or committing here would trigger this workflow again.
          git diff --cached --quiet || git commit -m "Publish built mod jar [skip ci]"
          git push

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: orbital-arsenal-mod
          path: minecraft/fabric-mod/build/libs/*.jar
          if-no-files-found: error
