name: Unpack Mercury ZIP

# Manual only, on purpose.
#
# This job overwrites the working tree with the contents of mathmind.zip and
# pushes the result. When it also ran on push, dropping an older zip into the
# repository silently reverted the project to that snapshot -- which is how the
# streaming chat route got replaced once already. Run it from the Actions tab
# when you really do mean to replace the project with a zip.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf unpacked
          mkdir unpacked
          unzip -q mercury.zip -d unpacked

          if [ -f "unpacked/package.json" ]; then
            cp -a unpacked/. .
          else
            found=""
            count=0

            for dir in unpacked/*/; do
              if [ -f "${dir}package.json" ]; then
                found="$dir"
                count=$((count + 1))
              fi
            done

            if [ "$count" -eq 1 ]; then
              cp -a "${found}." .
            else
              cp -a unpacked/. .
            fi
          fi

          rm -rf unpacked mercury.zip

      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack Mercury project"
          git push
