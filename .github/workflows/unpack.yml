name: Unpack MathMind ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "mathmind.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf unpacked
          mkdir unpacked
          unzip -q mathmind.zip -d unpacked

          if [ -f "unpacked/package.json" ]; then
            cp -a unpacked/. .
          else
            found=""
            count=0

            for dir in unpacked/*/; do
              if [ -f "${dir}package.json" ]; then
                found="$dir"
                count=$((count + 1))
              fi
            done

            if [ "$count" -eq 1 ]; then
              cp -a "${found}." .
            else
              cp -a unpacked/. .
            fi
          fi

          rm -rf unpacked mathmind.zip

      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack MathMind project"
          git push
