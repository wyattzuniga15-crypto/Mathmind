<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <style>
      .bg { fill: #4f46e5; }
      .accent { fill: #ffffff; }
    </style>
  </defs>
  <!-- Background circle -->
  <circle class="bg" cx="128" cy="128" r="128"/>

  <!-- Mercury swirl/wave design -->
  <g class="accent">
    <!-- Top wave -->
    <path d="M 60 100 Q 90 70, 128 80 Q 166 90, 196 100 Q 200 102, 200 106 Q 200 110, 196 112 Q 166 122, 128 112 Q 90 102, 60 112 Q 56 114, 56 110 Q 56 106, 60 100" fill="currentColor"/>

    <!-- Middle swirl -->
    <path d="M 50 130 Q 85 110, 128 125 Q 171 140, 206 130 Q 210 128, 210 132 Q 210 138, 206 142 Q 171 152, 128 137 Q 85 122, 50 142 Q 46 144, 46 140 Q 46 134, 50 130" fill="currentColor" opacity="0.85"/>

    <!-- Bottom wave -->
    <path d="M 70 160 Q 100 140, 128 155 Q 156 170, 186 160 Q 190 158, 190 162 Q 190 168, 186 172 Q 156 182, 128 167 Q 100 152, 70 172 Q 66 174, 66 170 Q 66 164, 70 160" fill="currentColor" opacity="0.7"/>
  </g>

  <!-- Highlight accent -->
  <circle class="accent" cx="180" cy="95" r="12" opacity="0.6"/>
</svg>