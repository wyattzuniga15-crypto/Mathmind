# ---------------------------------------------------------------------------
# CHECK THESE FOUR LINES BEFORE BUILDING.
#
# Go to https://fabricmc.net/develop/ , pick 1.21.11, and copy the values it
# shows. They are the only thing here tied to a Minecraft version, and they
# change with every release, so the numbers below are a starting point rather
# than a guarantee. If the build fails resolving dependencies, this is why.
# ---------------------------------------------------------------------------
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.17.2
fabric_version=0.135.0+1.21.11

# These rarely change.
loom_version=1.11-SNAPSHOT
mod_version=1.0.0
maven_group=com.orbital
archives_base_name=orbital-arsenal

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
